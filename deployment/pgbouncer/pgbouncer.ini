; deployment/pgbouncer/pgbouncer.ini — v10.74 PgBouncer config template
;
; Copy to ./deployment/pgbouncer/pgbouncer.ini and customize for your
; environment. Most values are pulled from environment variables in
; docker-compose.pgbouncer.yml; this file overrides at the ini level
; for anything not exposed via env.
;
; Reference: https://www.pgbouncer.org/config.html

[databases]
; Map application database names to upstream Postgres connections.
; Format: dbname = host=... port=... dbname=... [user=... password=...]
;
; The * wildcard line catches any database not explicitly listed
; and routes to the upstream postgres at $DB_HOST:$DB_PORT. This is
; convenient for development; in production, list each database
; explicitly so an unintended db name doesn't reach Postgres.
* = host=postgres port=5432

; Example: explicit db with overridden pool size
; a2z = host=postgres port=5432 dbname=a2z pool_size=30

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

; Auth — see userlist.txt for hashed credentials
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Pool mode:
;   session     — connection reused only at session boundary; preserves
;                 prepared statements + temp tables across queries
;   transaction — connection reused at transaction boundary; recommended
;                 for web apps; prepared statements lost between txns
;   statement   — connection reused after every statement; most aggressive
;                 pooling, breaks multi-statement transactions
pool_mode = transaction

; Max simultaneous client connections that PgBouncer will accept.
; If clients exceed this, they're queued.
max_client_conn = 500

; Pool sizes (per pool — i.e., per-database, per-user combination)
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 5

; Server-side limits — PgBouncer won't open more than this many
; connections to the upstream Postgres. Set this < Postgres's
; max_connections (postgresql.conf) so that direct connections
; from migrations / DBAs are still possible.
max_db_connections = 100
max_user_connections = 100

; Connection lifecycle
server_idle_timeout = 600
server_lifetime = 3600
client_idle_timeout = 0
query_timeout = 0
query_wait_timeout = 120

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; Admin + stats console (connect via psql)
;   psql -h pgbouncer -p 5432 -U stats_user pgbouncer
admin_users = postgres
stats_users = stats_user

; TLS — if your Postgres requires SSL, set client/server modes here.
; Leave commented for plain connections (acceptable on isolated
; container networks).
;client_tls_sslmode = require
;server_tls_sslmode = require

; Misc
ignore_startup_parameters = extra_float_digits
