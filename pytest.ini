[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Fail on first error in CI to surface problems quickly.
# Drop `-x` for local development if you want all tests to run.
# NOTE: coverage flags are passed via CI command line, not addopts here,
# because pytest-cov isn't always installed locally and would crash
# pytest if added to addopts unconditionally.
addopts =
    --strict-markers
    --strict-config
    -ra
    --tb=short
    --color=yes

# Markers — declare them so --strict-markers doesn't reject typoed ones.
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: requires external services (PG, FastAPI server)
    security: security-critical tests for V-001..V-004 mitigations

# Filter warnings — keep noise low.
filterwarnings =
    ignore::DeprecationWarning:streamlit.*
    ignore::DeprecationWarning:google.*

# Minimum Python version (matches utils/api.py FastAPI 0.100+)
minversion = 7.0
