name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  audit:
    name: Audit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run audit (gates)
        run: python scripts/audit.py

      - name: Run audit (JSON output)
        run: python scripts/audit.py --json | python -m json.tool

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: BSC engine self-test
        run: python -m utils.bsc_engine

      - name: All engine self-tests (v10.74 — auto-discovers utils/ engines with self_test())
        run: python scripts/run_engine_self_tests.py

      - name: Structural integrity audit (v10.38 — G128)
        run: python scripts/structure_audit.py

      - name: pytest with coverage (Standard #4)
        run: |
          pytest -v \
            --cov \
            --cov-config=.coveragerc \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html

      - name: Upload coverage XML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload coverage HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

      - name: pytest (security marker only)
        run: pytest -v -m security

      - name: Re-run audit with coverage data (G18 thresholds)
        run: python scripts/audit.py
